{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block guest_content %}
<div class="min-h-screen grid place-items-center px-4 bg-gradient-to-br from-brand-50 via-white to-slate-100 dark:from-slate-950 dark:via-slate-950 dark:to-slate-900">
  <div class="w-full max-w-sm appear" style="animation-delay: 0ms">
    <div class="flex flex-col items-center mb-6 appear" style="animation-delay: 40ms">
      <div class="h-12 w-12 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white font-bold text-lg shadow-xl shadow-brand-500/30 mb-3">L</div>
      <h1 class="text-xl font-semibold text-slate-900 dark:text-white">Welcome back</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400">Log in to your library workspace</p>
    </div>

    <div class="appear card-hover rounded-2xl border border-slate-200/70 dark:border-slate-800 bg-white/80 dark:bg-slate-900/60 backdrop-blur-xl shadow-xl shadow-slate-900/5 p-6" style="animation-delay: 90ms">
      <form method="post" action="{{ url_for('auth.login') }}" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email</label>
          <input name="email" type="email" required autofocus
                 class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
        </div>
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
            <a href="{{ url_for('auth.forgot_password') }}" class="text-xs font-medium text-brand-600 dark:text-brand-400 hover:underline">Forgot password?</a>
          </div>
          <input name="password" type="password" required
                 class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
        </div>
        <button class="w-full rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold py-2.5 transition-colors shadow-lg shadow-brand-500/30">
          Log in
        </button>
      </form>
    </div>
    <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-4">
      New here?
      <a href="{{ url_for('auth.signup') }}" class="font-medium text-brand-600 dark:text-brand-400 hover:underline">Create an organization</a>
    </p>
  </div>
</div>
{% endblock %}
