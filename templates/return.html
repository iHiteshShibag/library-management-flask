{% extends "base.html" %}
{% block title %}Return book{% endblock %}
{% block page_title %}Return book{% endblock %}
{% block content %}
<div class="max-w-xl rounded-2xl border border-slate-200/70 dark:border-slate-800 bg-white/80 dark:bg-slate-900/60 backdrop-blur-xl shadow-sm p-6">
  {% if not trans %}
  <p class="text-sm text-slate-500 dark:text-slate-400">No outstanding issues to return.</p>
  {% else %}
  <form method="post" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Outstanding issues</label>
      <select name="transaction_id" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
        {% for t in trans %}
          <option value="{{ t.id }}">{{ t.book.title }} — issued to {{ t.member.name }} on {{ t.issue_date.strftime('%Y-%m-%d') }}</option>
        {% endfor %}
      </select>
    </div>
    <button data-magnetic="0.15" class="rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold px-4 py-2 transition-colors">Return book</button>
  </form>
  {% endif %}
</div>
{% endblock %}
